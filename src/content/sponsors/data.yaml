# スポンサー様一覧（About ページ「Sponsors」セクション）
#
# 追加手順
#   1. ロゴ画像を src/content/sponsors/logos/ に置く（png / jpg / svg）
#   2. 下の sponsors: に次の形式で追記する（記載順に表示される）
#
#   - name: 会社・団体名
#     logo: ./logos/example.png     # 必須。上で置いたファイルへの相対パス
#     logo_background: light        # 任意。light（既定・白地）/ dark（黒地）/ none（下地なし）
#     url: https://example.com/     # 任意。指定するとカード全体がリンクになる
#     description: 支援内容や企業紹介を1〜3文で。   # 任意
#
# インデントは半角スペース。"- " の後ろの空白を忘れないこと。
# 全部消して 1 件も載せない状態に戻すときは sponsors: [] と書く。
# 逆に [] が残ったまま下に追記すると YAML が壊れてビルドが落ちるので、
# 1 件目を書くときは [] を消してから書く。
#
# sponsors が空のあいだは Sponsors ページの一覧が表示されない。
#
# message は一覧の下に出る文章（協賛のお願い、意気込みなど）。
# 空のあいだは表示されない。改行したいときは次のように書く。
#
#   message: |
#     1 行目
#     2 行目

message: |
  私たちの活動は、企業・団体の皆様のご支援によって支えられています。

  ハイブリッドロケットや模擬人工衛星CanSatの製作には、部材や加工、電子部品、試験の場など、学生だけでは用意できないものが数多くあります。ご支援をいただけることで、私たちは設計から製作、運用までを自分たちの手で完結させる挑戦を続けることができています。

  ご協賛・ご協力いただける企業・団体の皆様を募集しています。ご興味をお持ちいただけましたら、step@stb.tsukuba.ac.jp までご連絡ください。

sponsors:
  - name: 筑波大学宇宙技術プロジェクトSTEP
    logo: ./logos/STEPlogounuse.jpg
    logo_background: dark
    url: https://www.stb.tsukuba.ac.jp/~step/
    description: 筑波大学宇宙技術プロジェクト(STEP)は、ハイブリッドロケットや模擬人工衛星の開発を行う筑波大学の学生団体です。
