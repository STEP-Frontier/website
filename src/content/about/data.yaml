representative_message: |
  筑波大学宇宙技術プロジェクト（STEP）令和8年度代表の杉山咲穂です。

  私たちの理念は実際のものづくりでしか得られない「総合的実践力」を養うことです。学生団体として、設計・製作・運用の全工程を自らの手で一貫して行っており、宇宙に興味を持ったメンバーが集まって、ハイブリッドロケットとCanSatを日々つくっています。

  私自身はロケット製作に携わっていますが、複合的要素で成り立つプロジェクトを自分たちで回していくことの難しさを痛感しています。どうやったら理想に近いものが作れるのか、どうやったら打ち上げまで漕ぎつけられるのか。実験もチームの団結も簡単にはうまく行きません。ですが、この場所で悩みながらも過ごした時間がプロジェクトを成功へと導き、チームや技術者としても成長させると信じています。

  所属するメンバーには工学系以外の分野を専攻している学生も多く、多様なバックグラウンドを持っています。それが学類の垣根のない筑波大学の土壌を生かした、この団体ならではの良さです。それぞれの専攻は違っても、「ロケットを打ち上げたい」「高いミッションを達成したい」という志は同じです。その瞬間のため、私たちはこれからも進んでいきます。

  最後になりますが、私たちの活動は多くの方々の温かいお力添えがあってこそ成り立っています。日頃より多大なるご支援をいただいている協賛企業、筑波大学関係者、各種大会・イベント運営関係者、ならびにOB・OGの皆様、そして私たちを応援してくださる全ての皆様方に心より感謝申し上げます。今後とも筑波大学宇宙技術プロジェクト（STEP）をよろしくお願いいたします。

  筑波大学宇宙技術プロジェクト（STEP）代表
  杉山咲穂

