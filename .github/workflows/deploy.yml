name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"

      - name: Cache npm and Next.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            {{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!node_modules/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Build
        run: |
          npm install
          npm run build

      - name: Deploy to STB Server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: step
          server: "www.stb.tsukuba.ac.jp"
          ssh_private_key: ${{ secrets.STB_SSH_PRIVATE_KEY }}
          local_path: "./out/*"
          remote_path: "/public_html/"
          sftpArgs: "-o ConnectTimeout=5"
