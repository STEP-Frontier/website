name: Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [microcms]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: "production"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache microCMS images
        uses: actions/cache@v4
        with:
          path: |
            public/cms-images
          key: cms-images-${{ github.run_id }}
          restore-keys: cms-images-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Astro site
        env:
          MICROCMS_ENDPOINT: ${{ secrets.MICROCMS_ENDPOINT }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          bun install --frozen-lockfile
          bun run build:prod

      - name: Deploy to STB Server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: step
          server: "www.stb.tsukuba.ac.jp"
          ssh_private_key: ${{ secrets.STB_SSH_PRIVATE_KEY }}
          local_path: "./dist/*"
          remote_path: "/public_html/"
          sftpArgs: "-o ConnectTimeout=5"
